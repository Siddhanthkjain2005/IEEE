name: Bug report
description: Report a reproducible interface or evidence-workflow problem.
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: "Please use a labelled synthetic example or public bundled source. Do not include keys, private observations, precise private locations or unredacted logs. For security issues, read SECURITY.md."
  - type: input
    id: environment
    attributes:
      label: Browser and device
      description: Browser/version, device and approximate screen size.
    validations:
      required: true
  - type: input
    id: route
    attributes:
      label: Route and collection
      placeholder: /showcase → Evidence lab
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the selected public source or synthetic record, if relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Screenshots or redacted errors are helpful.
    validations:
      required: true
